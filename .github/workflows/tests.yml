name: recorder-tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Checkpoint 0 safety baseline
        run: python -m unittest -v checkpoint0_tests/test_recorder_safety_baseline.py
      - name: Checkpoint 1 and 2 regression suite
        run: python -m unittest discover -s tests -v
